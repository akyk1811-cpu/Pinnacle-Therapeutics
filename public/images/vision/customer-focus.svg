<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="cfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <filter id="sh4">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#cfBg)" />
  <circle cx="150" cy="120" r="180" fill="#2DD4BF" opacity="0.2" />
  <rect x="50" y="40" width="700" height="420" fill="rgba(255, 255, 255, 0.06)" rx="20" stroke="rgba(255, 255, 255, 0.2)" filter="url(#sh4)" />

  <g transform="translate(400, 210)" filter="url(#sh4)">
    <circle cx="0" cy="0" r="80" fill="rgba(255, 255, 255, 0.12)" stroke="#2DD4BF" stroke-width="4" />
    <!-- Globe & connection network -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#5EEAD4" stroke-width="4" />
    <ellipse cx="0" cy="0" rx="50" ry="20" fill="none" stroke="#5EEAD4" stroke-width="3" />
    <line x1="0" y1="-50" x2="0" y2="50" stroke="#5EEAD4" stroke-width="3" />
    <line x1="-50" y1="0" x2="50" y2="0" stroke="#5EEAD4" stroke-width="3" />
  </g>

  <text x="400" y="380" font-family="system-ui, sans-serif" font-size="32" font-weight="900" fill="#FFFFFF" text-anchor="middle">PATIENT &amp; CUSTOMER FOCUS</text>
  <text x="400" y="415" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#99F6E4" text-anchor="middle" letter-spacing="1.5">GLOBAL HEALTHCARE ACCESS &amp; PARTNERSHIPS</text>
</svg>