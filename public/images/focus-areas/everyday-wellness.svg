<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="ewBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0" />
    </radialGradient>
    <filter id="dropShadow">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- High-def background gradient with sunlit vitality -->
  <rect width="1200" height="800" fill="url(#ewBg)" />
  <rect width="1200" height="800" fill="url(#sunGlow)" />

  <!-- Botanical and Vitality Geometry -->
  <circle cx="950" cy="180" r="280" fill="#F59E0B" opacity="0.15" />
  <circle cx="200" cy="650" r="220" fill="#34D399" opacity="0.2" />

  <!-- Glassmorphic Central Card displaying Wellness & Immunity concept -->
  <rect x="150" y="120" width="900" height="560" fill="rgba(255, 255, 255, 0.08)" rx="28" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2" filter="url(#dropShadow)" />

  <!-- Natural Wellness Icon & Botanical Leaf Emblem -->
  <g transform="translate(600, 320)" filter="url(#dropShadow)">
    <circle cx="0" cy="0" r="110" fill="#FFFFFF" opacity="0.15" stroke="#FDE047" stroke-width="4" />
    <path d="M-40 20 C-60 -40 20 -70 40 -10 C20 40 -20 60 -40 20 Z" fill="#34D399" />
    <path d="M-40 20 L20 -10" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    <circle cx="35" cy="-35" r="14" fill="#FDE047" />
  </g>

  <text x="600" y="520" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">EVERYDAY WELLNESS &amp; VITALITY</text>
  <text x="600" y="570" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#A7F3D0" text-anchor="middle" letter-spacing="2">DAILY IMMUNITY · CELLULAR DEFENSE · ANTIOXIDANT VITALITY</text>
</svg>