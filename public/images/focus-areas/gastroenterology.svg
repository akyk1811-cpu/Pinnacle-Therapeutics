  <text x="600" y="520" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">GASTROENTEROLOGY</text>
  <text x="600" y="570" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#FDE68A" text-anchor="middle" letter-spacing="2">DIGESTIVE HEALTH · ACID CONTROL · MUCOSAL PROTECTION</text>
