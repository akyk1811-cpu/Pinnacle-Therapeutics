    <circle cx="0" cy="0" r="110" fill="rgba(255, 255, 255, 0.15)" stroke="#FBBF24" stroke-width="4" />
    <!-- Mucosal shield & digestive balance emblem -->
    <path d="M0 -60 L50 -30 L50 20 C50 50 0 75 0 75 C0 75 -50 50 -50 20 L-50 -30 Z" fill="#F59E0B" />
